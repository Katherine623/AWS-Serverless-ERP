name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: erp-staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VAR_aws_region: ap-northeast-1
  TF_VAR_erp_environment: staging
  TF_VAR_seed_demo: "false"
  TF_VAR_api_auth_enabled: "true"
  TF_VAR_manage_cognito_user_pool: "true"
  TF_VAR_cognito_user_pool_name: erp-receiving-platform-users
  TF_VAR_enable_excel_import: "true"
  TF_VAR_enable_frontend_cdn: "false"

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::Set the GitHub staging variable AWS_DEPLOY_ROLE_ARN before deploying."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-erp-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run checks
        run: |
          ruff check .
          pip-audit -r requirements.txt
          pytest
          node --check web/app.js

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      - name: Check Terraform formatting
        working-directory: infra
        run: terraform fmt -check

      - name: Initialize remote Terraform state
        working-directory: infra
        run: terraform init -input=false -lock-timeout=5m

      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate

      - name: Create Terraform plan
        working-directory: infra
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply Terraform plan
        working-directory: infra
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan
